<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>轨迹观察台 · Artifacts</title>
<style>
:root{color-scheme:light;--ink:#182a35;--muted:#647782;--line:#dce5e7;--accent:#087f72;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:#f1f5f4;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1500px;margin:auto;padding:36px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent)}h1{font-size:30px;letter-spacing:-1px;margin:5px 0}h2{font-size:17px;margin:0}p{margin:3px 0;color:var(--muted)}.badge{padding:6px 12px;border:1px solid #b7d8ce;border-radius:20px;color:var(--accent)}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.grow{flex:1;min-width:220px}select,button,input{font:inherit;border:1px solid #cdd9dc;border-radius:7px;padding:9px 12px;background:white;color:var(--ink)}select{max-width:100%;min-width:160px}button{cursor:pointer;white-space:nowrap}button:hover{border-color:var(--accent);color:var(--accent)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.status{font-size:12px;margin-top:10px;overflow-wrap:anywhere}.status.error{color:#b33f32}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.metric{padding:18px;background:white;border:1px solid var(--line);border-radius:12px}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:28px;line-height:1.3;margin-top:6px;font-variant-numeric:tabular-nums}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.table-wrap{overflow:auto;max-height:410px}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f6f9f8;font-size:12px;color:var(--muted);font-weight:500;z-index:1}th,td{padding:10px 12px;border-bottom:1px solid #edf1f2}tr.selected td{background:#e6f4ef}.row-button{border:0;background:transparent;color:var(--accent);padding:0;text-align:left}.preview{white-space:normal;min-width:220px;max-width:450px;font-size:12px;color:var(--muted)}.negative{color:#b33f32}.positive{color:var(--accent)}.empty{padding:28px;text-align:center;color:var(--muted)}.inspectors{display:grid;grid-template-columns:1fr 1fr;gap:20px}.inspectors .card{min-width:0}pre{margin:14px 0 0;padding:18px;background:#12262d;color:#d6e9e6;border-radius:9px;overflow:auto;height:460px;font:12px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:12px}.path{font-family:monospace;color:var(--accent)}footer{color:var(--muted);font-size:12px;margin-top:8px}@media(max-width:850px){main{padding:20px}.inspectors{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}header{align-items:start}.badge{display:none}h1{font-size:25px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">AGENT OBSERVATORY</div><h1>轨迹观察台</h1><p>浏览运行结果，查看上下文如何被压缩。</p></div><span class="badge">Artifacts · 只读查看</span></header>
<section class="card"><div class="toolbar"><label class="grow">选择 JSON 文件<select id="file"></select></label><button id="reload" class="primary">重新读取文件</button><button id="refresh">刷新列表</button></div><div id="status" class="status" role="status" aria-live="polite">正在加载文件列表…</div></section>
<section class="metrics"><div class="metric"><span>行动请求 · prompts</span><strong id="prompts">—</strong></div><div class="metric"><span>模型响应 · responses</span><strong id="responses">—</strong></div><div class="metric"><span>压缩次数</span><strong id="count">—</strong></div><div class="metric"><span>平均上下文缩减比例</span><strong id="reduction">—</strong></div></section>
<section class="card"><div class="section-head"><div><h2>全部压缩记录</h2><p class="small">点击记录，在下方查看原始上下文、请求与完整响应。Token 数为轨迹中的估算值。</p></div></div><div class="table-wrap"><table><thead><tr><th>记录</th><th>发生步数</th><th>压缩前</th><th>压缩后</th><th>缩减比例</th><th>摘要预览</th></tr></thead><tbody id="records"></tbody></table><div id="empty" class="empty" hidden>此文件没有压缩记录，仍可通过下方字段浏览器查看完整数据。</div></div></section>
<section class="inspectors">
<div class="card"><div class="section-head"><h2>文件字段</h2><button data-copy="file-content">复制内容</button></div><div class="toolbar"><label class="grow">顶层字段<select id="field"></select></label><label>数组元素<select id="entry"></select></label></div><p id="field-path" class="small path"></p><pre id="file-content" class="wrap" tabindex="0"></pre></div>
<div class="card"><div class="section-head"><h2>压缩详情</h2><button data-copy="record-content">复制内容</button></div><div class="toolbar"><label class="grow">压缩记录<select id="record"></select></label><label>记录字段<select id="record-field"></select></label></div><p id="record-path" class="small path"></p><pre id="record-content" class="wrap" tabindex="0"></pre></div>
</section><footer>内容按原始数据展示，不执行文件内的 HTML 或命令。运行中轨迹可能尚未保存，请在运行结束后重新读取。</footer>
</main><script>
const $=id=>document.getElementById(id);let data=null,records=[],files=[],generation=0;
const format=value=>typeof value==='string'?value:JSON.stringify(value,null,2);
const number=value=>typeof value==='number'?value.toLocaleString():'—';
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function options(select,items){select.replaceChildren(...items.map(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;return option}))}
async function api(path){const r=await fetch(path,{cache:'no-store'});const result=await r.json();if(!r.ok)throw Error(result.error||`HTTP ${r.status}`);return result}
function keys(value){return value&&typeof value==='object'&&!Array.isArray(value)?Object.keys(value):[]}
function clear(){data=null;records=[];for(const id of ['prompts','responses','count','reduction'])$(id).textContent='—';for(const id of ['field','entry','record','record-field'])options($(id),[]);for(const id of ['file-content','record-content','field-path','record-path'])$(id).textContent='';$('records').replaceChildren();$('empty').hidden=false}
async function refresh(){const previous=$('file').value;try{files=(await api('/api/files')).files;options($('file'),files.map(f=>[f.name,f.name]));if(files.some(f=>f.name===previous))$('file').value=previous;if(files.length)await load();else{generation++;clear();status('artifacts 下暂时没有 JSON 文件。')}}catch(e){status(e.message,true)}}
async function load(){const name=$('file').value;if(!name)return;const current=++generation;clear();status('正在读取 '+name+'…');try{const result=await api('/api/artifact?name='+encodeURIComponent(name));if(current!==generation)return;data=result.data;render();const info=files.find(f=>f.name===name);status(`${name} · ${info?(info.size/1024).toFixed(1)+' KB · ':''}已读取 ${new Date().toLocaleTimeString()}`)}catch(e){if(current===generation)status(e.message,true)}}
function render(){records=Array.isArray(data?.compactions)?data.compactions:[];$('prompts').textContent=Array.isArray(data?.prompts)?number(data.prompts.length):'—';$('responses').textContent=Array.isArray(data?.responses)?number(data.responses.length):'—';$('count').textContent=number(records.length);const ratios=records.filter(r=>r&&typeof r.estimated_tokens_before==='number'&&r.estimated_tokens_before>0&&typeof r.estimated_tokens_after==='number').map(r=>1-r.estimated_tokens_after/r.estimated_tokens_before);$('reduction').textContent=ratios.length?(100*ratios.reduce((a,b)=>a+b,0)/ratios.length).toFixed(1)+'%':'—';
options($('field'),[['all','完整文件'],...keys(data).map(k=>['key:'+k,k])]);if(keys(data).includes('compactions'))$('field').value='key:compactions';fieldChanged();
options($('record'),records.map((r,i)=>[String(i),`#${i+1} · Step ${r?.step??'—'}`]));$('empty').hidden=records.length>0;
records.forEach((r,i)=>{const row=document.createElement('tr');const cell=document.createElement('td');const button=document.createElement('button');button.className='row-button';button.textContent='#'+(i+1);button.onclick=()=>{$('record').value=String(i);recordChanged();$('record-content').scrollIntoView({behavior:'smooth',block:'nearest'})};cell.append(button);row.append(cell);const before=r?.estimated_tokens_before,after=r?.estimated_tokens_after;const ratio=typeof before==='number'&&before>0&&typeof after==='number'?100*(1-after/before):null;const preview=r?.compaction_response?.choices?.[0]?.message?.content;[r?.step??'—',number(before),number(after),ratio===null?'—':ratio.toFixed(1)+'%',typeof preview==='string'?preview.slice(0,160):'无文本摘要'].forEach((value,j)=>{const td=document.createElement('td');td.textContent=String(value);if(j===3)td.className=ratio<0?'negative':'positive';if(j===4)td.className='preview';row.append(td)});$('records').append(row)});recordChanged()}
function selectedField(){return $('field').value==='all'?data:data?.[$('field').value.slice(4)]}
function fieldChanged(){const value=selectedField();options($('entry'),[['all','全部内容'],...(Array.isArray(value)?value.map((_,i)=>[String(i),`[${i}]`]):[])]);$('entry').disabled=!Array.isArray(value);showField()}
function showField(){let value=selectedField();let path=$('field').value==='all'?'$':'$['+JSON.stringify($('field').value.slice(4))+']';if($('entry').value!=='all'){value=value?.[Number($('entry').value)];path+='['+$('entry').value+']'}$('field-path').textContent=path;$('file-content').textContent=format(value)??'无内容'}
function recordChanged(){const record=records[Number($('record').value)];const previous=$('record-field').value;options($('record-field'),[['all','完整记录'],...keys(record).map(k=>['key:'+k,k])]);if([...$('record-field').options].some(o=>o.value===previous))$('record-field').value=previous;[...$('records').children].forEach((row,i)=>row.classList.toggle('selected',i===Number($('record').value)));showRecord()}
function showRecord(){if(!records.length){$('record-content').textContent='暂无压缩记录';$('record-path').textContent='';return}const i=Number($('record').value);let value=records[i],path=`$.compactions[${i}]`;if($('record-field').value!=='all'){const key=$('record-field').value.slice(4);value=value?.[key];path+='['+JSON.stringify(key)+']'}$('record-path').textContent=path;$('record-content').textContent=format(value)??'无内容'}
$('file').onchange=load;$('reload').onclick=load;$('refresh').onclick=refresh;$('field').onchange=fieldChanged;$('entry').onchange=showField;$('record').onchange=recordChanged;$('record-field').onchange=showRecord;
document.querySelectorAll('[data-copy]').forEach(button=>button.onclick=async()=>{const value=$(button.dataset.copy).textContent;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const area=document.createElement('textarea');area.value=value;document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw Error('请在内容区域手动选择并复制。')}status('内容已复制。')}catch(e){status(e.message,true)}});
refresh();
</script></body></html>
